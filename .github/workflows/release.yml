name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes -- "$GITHUB_REF_NAME"
